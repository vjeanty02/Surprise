<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Une question importante 💌</title>
<style>
  /* ===== Variables globales ===== */
  :root {
    --pink: #ff5da2;
    --pink-dark: #e8408e;
    --bg1: #ffdde1;
    --bg2: #ffe9c7;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg1));
    background-size: 300% 300%;
    animation: gradientShift 12s ease-in-out infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ===== Cœurs flottants en fond ===== */
  .heart {
    position: absolute;
    color: rgba(255, 93, 162, 0.35);
    font-size: 24px;
    animation: float 8s linear infinite;
    pointer-events: none;
  }

  @keyframes float {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  /* ===== Carte principale ===== */
  .card {
    background: white;
    border-radius: 24px;
    padding: 48px 56px;
    box-shadow: 0 14px 30px rgba(232, 64, 142, 0.2);
    text-align: center;
    z-index: 2;
    max-width: 90vw;
    animation: floatCard 4.5s ease-in-out infinite;
  }

  @keyframes floatCard {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  h1 {
    color: var(--pink-dark);
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .emoji {
    font-size: 3rem;
    margin-bottom: 10px;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }

  /* ===== Boutons Oui / Non ===== */
  .buttons {
    margin-top: 30px;
    display: flex;
    gap: 24px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    position: relative;
    min-height: 70px;
  }

  button {
    border: none;
    border-radius: 50px;
    padding: 16px 30px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:active {
    transform: scale(0.94);
  }

  #yes-btn {
    background: var(--pink);
    color: white;
    box-shadow: 0 8px 20px rgba(255, 93, 162, 0.4);
  }

  #yes-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 26px rgba(255, 93, 162, 0.55);
  }

  #no-btn {
    background: #f1f1f1;
    color: #555;
    position: fixed;
    transition: top 0.18s ease, left 0.18s ease;
    z-index: 5;
  }

  #result {
    margin-top: 22px;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--pink-dark);
    min-height: 30px;
  }

  .tries {
    margin-top: 8px;
    font-size: 0.9rem;
    color: #999;
  }

  /* ===== Carrousel des étapes ===== */
  .carousel-wrap {
    display: none;
    margin-top: 24px;
    width: 100%;
  }

  .carousel-wrap.active {
    display: block;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Contenu de l'étape (badge + emoji + titre + texte) : ce bloc bouge à chaque changement */
  .step-content {
    animation-duration: 0.45s;
    animation-timing-function: ease;
    animation-fill-mode: both;
  }

  .step-content.slide-right {
    animation-name: slideInRight;
  }

  .step-content.slide-left {
    animation-name: slideInLeft;
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(36px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-36px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .step-badge {
    display: inline-block;
    background: var(--pink);
    color: white;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 5px 16px;
    border-radius: 20px;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
  }

  .step-emoji {
    font-size: 2.4rem;
    margin-bottom: 10px;
    animation: popIn 0.45s ease;
  }

  @keyframes popIn {
    0%   { transform: scale(0.4); opacity: 0; }
    60%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }

  .step-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--pink-dark);
    margin-bottom: 10px;
  }

  .step-text {
    font-size: 1rem;
    line-height: 1.55;
    color: #444;
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  .carousel-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 22px;
  }

  .nav-arrow {
    background: #fff0f5;
    color: var(--pink-dark);
    border: 2px solid var(--pink);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .nav-arrow:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .nav-arrow:not(:disabled):hover {
    background: var(--pink);
    color: white;
    transform: scale(1.08);
  }

  .dots {
    display: flex;
    gap: 8px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #f3c9d9;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .dot.active {
    background: var(--pink);
    transform: scale(1.3);
  }

  /* ===== Responsive ===== */
  @media (max-width: 480px) {
    .card {
      padding: 32px 24px;
      border-radius: 18px;
    }

    h1 {
      font-size: 1.4rem;
    }

    .emoji {
      font-size: 2.2rem;
    }

    button {
      padding: 13px 20px;
      font-size: 0.9rem;
    }

    .buttons {
      gap: 14px;
      margin-top: 22px;
    }

    #result {
      font-size: 1.05rem;
    }

    .step-text {
      font-size: 0.9rem;
      min-height: 170px;
    }

    .step-title {
      font-size: 1rem;
    }

    .nav-arrow {
      width: 36px;
      height: 36px;
      font-size: 1rem;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="emoji">💖</div>
  <h1>Veux-tu devenir ma petite amie ?</h1>

  <div class="buttons">
    <button id="yes-btn">Oui, mais je veux voir ce que tu propose 👀</button>
    <button id="no-btn">Non, j'ai un petit copain</button>
  </div>

  <div id="result"></div>
  <div class="tries" id="tries"></div>

  <div class="carousel-wrap" id="carousel">
    <div class="step-content" id="step-content">
      <div class="step-badge" id="step-badge">ETAP 1 / 7</div>
      <div class="step-emoji" id="step-emoji">💕</div>
      <div class="step-title" id="step-title"></div>
      <div class="step-text" id="step-text"></div>
    </div>

    <div class="carousel-nav">
      <button class="nav-arrow" id="prev-btn" aria-label="Étape précédente">←</button>
      <div class="dots" id="dots"></div>
      <button class="nav-arrow" id="next-btn" aria-label="Étape suivante">→</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ============================================================
     1. DONNÉES
  ============================================================ */
  const STEPS = [
    {
      emoji: "💕",
      title: "Kè Kontan (1/2)",
      text: "Renmen avèm se kè kontan chak jou, ti kado de ouff de tanzantan, ti sipriz, ti flè, fè ti sòti de tanzantan, 100% fidelite, 100% lanmou, 0% jalouzi."
    },
    {
      emoji: "🥰",
      title: "Kè Kontan (2/2)",
      text: "Depi w mennaj mwen, si w te lèd w ap vin bèl, si w te gen movèz fòm w ap vin gen bèl fòm, si vant ou te gwo vant ou ap vin plat, si w pat gen lajan w ap vin bòs lady. Ou panse sa yo enposib? Mennaj mwen pou w wè 😂"
    },
    {
      emoji: "💍",
      title: "Fiyansaj & Maryaj (1/2)",
      text: "Renmen avèm se fiyansaj epi maryaj nan 2 an si w santi w prè mantalman. Se yon bèl vi apre maryaj, kote n ap deside nan ki peyi nou vle al viv (Ayiti, Brezil, Kanada, RD)."
    },
    {
      emoji: "✈️",
      title: "Fiyansaj & Maryaj (2/2)",
      text: "Madanm mwen ap deside si l vle al travay oswa non. Si l pa al travay, m ap peye l 3 fwa salè minimòm nan. Ti vizit, ti vwayaj de tanzantan ✈️🛩️, minimum an Repiblik Dominikèn 😂"
    },
    {
      emoji: "🤫",
      title: "Sekrè...",
      text: "Sa k nan tèt la, wi l ap la tou 😏 Men si w vle m eksplike w kijan sa ap pase pi an detay… ekri m an prive 🤭"
    },
    {
      emoji: "🤭",
      title: "Vre oubyen se jwèt?",
      text: "Ou vle konnen si se vre? Chwazi \"Wi\" pou w wè 😂"
    },
    {
      emoji: "😏",
      title: "Nan Dout la",
      text: "Kè w kontan la, pa vre? 😏 Ou gen yon sèl kesyon k ap travay nan tèt ou: \"Èske l ap jwe, oubyen èske l serye?\" M ap kite w nan dout la… 😂🤭"
    }
  ];

  const YES_MESSAGES = [
    "Oui !! 🥰",
    "Enfin ! Tu m'as fait tourner en bourrique 😅",
    "C'est le plus beau jour de ma vie 💖",
    "Je le savais depuis le début 😏"
  ];

  const DODGE_MESSAGES = [
    "Tu es sûre... ? 👀",
    "Essaie encore ! 😂",
    "Trop lente ! 🏃‍♂️💨",
    "Presque ! 😜",
    "Il va falloir être plus rapide 😄",
    "Aïe, raté ! 😆"
  ];

  const CONFETTI_COLORS = ['#ff5da2', '#ffd166', '#06d6a0', '#118ab2', '#ef476f'];

  /* ============================================================
     2. RÉFÉRENCES DOM
  ============================================================ */
  const carousel     = document.getElementById('carousel');
  const stepContent   = document.getElementById('step-content');
  const stepBadge     = document.getElementById('step-badge');
  const stepEmoji     = document.getElementById('step-emoji');
  const stepTitle     = document.getElementById('step-title');
  const stepText      = document.getElementById('step-text');
  const dotsContainer = document.getElementById('dots');
  const prevBtn       = document.getElementById('prev-btn');
  const nextBtn       = document.getElementById('next-btn');

  const noBtn   = document.getElementById('no-btn');
  const yesBtn  = document.getElementById('yes-btn');
  const result  = document.getElementById('result');
  const triesEl = document.getElementById('tries');
  const emojiEl = document.querySelector('.emoji');

  let currentStep = 0;
  let attempts = 0;
  let noBtnPositioned = false;

  /* ============================================================
     3. CARROUSEL DES ÉTAPES
  ============================================================ */
  function renderDots() {
    dotsContainer.innerHTML = '';
    STEPS.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === currentStep ? ' active' : '');
      dotsContainer.appendChild(dot);
    });
  }

  function showStep(index, direction = 'right') {
    currentStep = index;
    const step = STEPS[index];

    stepBadge.textContent = `ETAP ${index + 1} / ${STEPS.length}`;
    stepEmoji.textContent = step.emoji;
    stepTitle.textContent = step.title;
    stepText.textContent  = step.text;

    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === STEPS.length - 1;

    // Relance l'animation de glissement à chaque changement d'étape
    stepContent.classList.remove('slide-right', 'slide-left');
    void stepContent.offsetWidth; // force le navigateur à "oublier" l'animation précédente
    stepContent.classList.add(direction === 'left' ? 'slide-left' : 'slide-right');

    renderDots();
  }

  prevBtn.addEventListener('click', (e) => {
    if (currentStep > 0) {
      showStep(currentStep - 1, 'left');
      burstHearts(e.currentTarget);
    }
  });

  nextBtn.addEventListener('click', (e) => {
    if (currentStep < STEPS.length - 1) {
      showStep(currentStep + 1, 'right');
      burstHearts(e.currentTarget);
    }
  });

  /* ============================================================
     4. BOUTON "NON" QUI SE SAUVE
  ============================================================ */
  function placeNoButtonInitially() {
    // Place le bouton "Non" juste à côté du bouton "Oui", sans chevauchement
    const yesRect = yesBtn.getBoundingClientRect();
    const noRect  = noBtn.getBoundingClientRect();
    const gap = 24;
    const margin = 20;

    let left = yesRect.right + gap;
    let top  = yesRect.top + (yesRect.height - noRect.height) / 2;

    // Si ça déborde à droite de l'écran, on le met en dessous à la place
    if (left + noRect.width + margin > window.innerWidth) {
      left = yesRect.left;
      top  = yesRect.bottom + gap;
    }

    noBtn.style.left = Math.max(margin, left) + 'px';
    noBtn.style.top  = Math.max(margin, top) + 'px';
    noBtnPositioned = true;
  }

  function moveNoButton() {
    const btnRect = noBtn.getBoundingClientRect();
    const yesRect = yesBtn.getBoundingClientRect();
    const margin = 20;
    let newX, newY, overlapsYes;

    do {
      const maxX = window.innerWidth - btnRect.width - margin;
      const maxY = window.innerHeight - btnRect.height - margin;
      newX = Math.max(margin, Math.random() * maxX);
      newY = Math.max(margin, Math.random() * maxY);

      // On évite de retomber pile sur le bouton "Oui"
      overlapsYes = !(
        newX + btnRect.width < yesRect.left - 10 ||
        newX > yesRect.right + 10 ||
        newY + btnRect.height < yesRect.top - 10 ||
        newY > yesRect.bottom + 10
      );
    } while (overlapsYes);

    noBtn.style.left = newX + 'px';
    noBtn.style.top  = newY + 'px';
    noBtnPositioned = true;
  }

  function dodge() {
    attempts++;
    moveNoButton();

    result.textContent = DODGE_MESSAGES[Math.floor(Math.random() * DODGE_MESSAGES.length)];
    triesEl.textContent = attempts === 1
      ? "1 tentative pour t'échapper 😏"
      : `${attempts} tentatives pour t'échapper 😏`;

    // Le bouton "Oui" grandit un peu à chaque essai raté
    const scale = Math.min(1 + attempts * 0.05, 2);
    yesBtn.style.transform = `scale(${scale})`;
  }

  // On fait fuir le bouton dès qu'on essaie de cliquer OU de le survoler
  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('click', (e) => {
    e.preventDefault();
    dodge();
  });
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    dodge();
  }, { passive: false });

  /* ============================================================
     5. VALIDATION ("OUI")
  ============================================================ */
  yesBtn.addEventListener('click', () => {
    result.textContent = YES_MESSAGES[Math.floor(Math.random() * YES_MESSAGES.length)];
    triesEl.textContent = '';

    noBtn.style.display = 'none';
    yesBtn.style.display = 'none';
    emojiEl.textContent = '🎉';

    createConfetti();
    showStep(0);
    carousel.classList.add('active');
  });

  /* ============================================================
     6. EFFETS VISUELS (cœurs + confettis)
  ============================================================ */
  function createHearts() {
    setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '💗';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (16 + Math.random() * 20) + 'px';
      heart.style.animationDuration = (6 + Math.random() * 4) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }, 600);
  }

  function burstHearts(originEl) {
    const rect = originEl.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const symbols = ['💗', '✨', '💕'];

    for (let i = 0; i < 6; i++) {
      const h = document.createElement('div');
      h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      h.style.position = 'fixed';
      h.style.left = centerX + 'px';
      h.style.top = centerY + 'px';
      h.style.fontSize = (12 + Math.random() * 10) + 'px';
      h.style.pointerEvents = 'none';
      h.style.zIndex = '20';
      h.style.transition = 'transform 0.7s ease-out, opacity 0.7s ease-out';
      document.body.appendChild(h);

      const angle = (Math.PI * 2 * i) / 6 + Math.random() * 0.5;
      const distance = 40 + Math.random() * 30;
      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance;

      requestAnimationFrame(() => {
        h.style.transform = `translate(${dx}px, ${dy}px) scale(1.4)`;
        h.style.opacity = '0';
      });
      setTimeout(() => h.remove(), 750);
    }
  }

  function createConfetti() {
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.style.position = 'fixed';
      c.style.top = '-10px';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.width = '8px';
      c.style.height = '8px';
      c.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      c.style.borderRadius = '50%';
      c.style.zIndex = '10';
      c.style.pointerEvents = 'none';
      c.style.transition = 'transform 2.5s ease-in, opacity 2.5s ease-in';
      document.body.appendChild(c);

      requestAnimationFrame(() => {
        c.style.transform = `translateY(${window.innerHeight + 20}px) rotate(${Math.random() * 720}deg)`;
        c.style.opacity = '0';
      });
      setTimeout(() => c.remove(), 2600);
    }
  }

  /* ============================================================
     7. INITIALISATION
  ============================================================ */
  window.addEventListener('resize', () => {
    if (noBtnPositioned) moveNoButton();
  });

  window.addEventListener('load', placeNoButtonInitially);

  createHearts();
})();
</script>

</body>
</html>
